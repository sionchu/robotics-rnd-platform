name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,vision,workcell,openusd]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -m "not hardware and not gpu and not simulation and not vendor and not slow"
      - run: python -m experiments.vision.run_all all --verify-only
      - run: python -m experiments.vision.pi_edge verify-preparation

  cpp:
    name: cpp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure with Ninja
        if: runner.os != 'Windows'
        run: cmake -S cpp -B cpp/build -G Ninja
      - name: Configure with Visual Studio
        if: runner.os == 'Windows'
        run: cmake -S cpp -B cpp/build -A x64
      - run: cmake --build cpp/build --config Release
      - run: ctest --test-dir cpp/build -C Release --output-on-failure
