name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,vision]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python -m experiments.vision.run_all all --verify-only
      - run: python -m experiments.vision.pi_edge verify-preparation
      - run: python -m experiments.robot.run_all verify
      - run: python -m robotics_rnd.rb mock-demo
      - run: python -m robotics_rnd.rb fault-demo
      - run: python scripts/verify_v03_release.py

  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S cpp -B cpp/build -G Ninja
      - run: cmake --build cpp/build
      - run: ctest --test-dir cpp/build --output-on-failure
